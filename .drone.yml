kind: pipeline
type: docker
name: build

trigger:
  branch:
    - main
  event:
    - push
    - pull_request

steps:
  - name: check
    image: node:24-alpine
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    commands:
      - npm ci --no-audit --no-fund
      - npm run check

  - name: publish
    image: plugins/docker
    settings:
      registry: ghcr.io
      repo: ghcr.io/notjanlive/hafk-dashboard
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - latest
        - ${DRONE_COMMIT_SHA:0:8}
    when:
      event:
        - push
